name: Build Windows
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Restore WPF
        run: msbuild src/ITDigitacao.Wpf/ITDigitacao.Wpf.csproj /t:Restore /p:Configuration=Release /p:Platform=x86 /verbosity:minimal
      - name: Verify WPF input files
        shell: pwsh
        run: |
          if (!(Test-Path 'src/ITDigitacao.Wpf/ITDigitacao.Wpf.csproj')) { throw 'WPF project missing' }
          if (!(Test-Path 'content/activities.json')) { throw 'Offline activity catalog missing' }
          $required = @(
            'src/ITDigitacao.Wpf/Assets/logo-instituto.png',
            'src/ITDigitacao.Wpf/Assets/Mascot/boas-vindas.png',
            'src/ITDigitacao.Wpf/Assets/Mascot/digitando.png',
            'src/ITDigitacao.Wpf/Assets/Mascot/ensinando.png',
            'src/ITDigitacao.Wpf/Assets/Mascot/celebrando.png',
            'src/ITDigitacao.Wpf/Assets/Icons/biblioteca.png',
            'src/ITDigitacao.Wpf/Assets/Icons/teclado.png',
            'src/ITDigitacao.Wpf/Assets/Icons/relogio.png'
          )
          foreach ($asset in $required) {
            if (!(Test-Path $asset) -or (Get-Item $asset).Length -eq 0) { throw "Required WPF asset missing or empty: $asset" }
          }
          $categories = @(Get-ChildItem 'src/ITDigitacao.Wpf/Assets/Categories/*.png')
          if ($categories.Count -ne 10) { throw "Expected 10 category illustrations, found $($categories.Count)" }
      - name: Build WPF desktop application
        run: msbuild src/ITDigitacao.Wpf/ITDigitacao.Wpf.csproj /m /p:Configuration=Release /p:Platform=x86 /verbosity:minimal
      - name: Core regression tests
        run: dotnet test tests/ITDigitacao.Core.Tests/ITDigitacao.Core.Tests.csproj --configuration Release --verbosity minimal
      - name: Verify WPF executable
        shell: pwsh
        run: |
          $exe = 'src/ITDigitacao.Wpf/bin/x86/Release/net48/IT-Digitacao-3.0.exe'
          if (!(Test-Path $exe)) { throw "WPF executable not generated: $exe" }
      - name: Package WPF release
        shell: pwsh
        run: |
          $out = 'dist/IT-Digitacao-3.0-Rebuild-Release'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item 'src/ITDigitacao.Wpf/bin/x86/Release/net48/*' $out -Recurse -Force
          Copy-Item 'README.md' $out -Force
          "Commit: $env:GITHUB_SHA`nVersion: 3.0`nProject: WPF`nArchitecture: x86`nFramework: .NET Framework 4.8" | Set-Content "$out/BUILD-INFO.txt"
          @("IT Digitação 3.0", "Extraia os arquivos e execute IT-Digitacao-3.0.exe.", "Requisito: .NET Framework 4.8.", "O aplicativo funciona offline.") | Set-Content "$out/LEIA-ME.txt"
          Compress-Archive -Path "$out/*" -DestinationPath 'dist/IT-Digitacao-3.0-Rebuild-Release.zip' -Force
      - name: Upload WPF release artifact
        uses: actions/upload-artifact@v4
        with:
          name: IT-Digitacao-3.0-Rebuild-Release
          path: dist/IT-Digitacao-3.0-Rebuild-Release.zip
