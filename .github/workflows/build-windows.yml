name: Build Windows
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Restore
        run: msbuild src/ITDigitacao.App/ITDigitacao.App.csproj /t:Restore /p:Configuration=Release /p:Platform=x86 /verbosity:minimal
      - name: Restore WPF visual preview
        run: msbuild src/ITDigitacao.Wpf/ITDigitacao.Wpf.csproj /t:Restore /p:Configuration=Release /p:Platform=x86 /verbosity:minimal
      - name: Build .NET Framework application
        run: msbuild src/ITDigitacao.App/ITDigitacao.App.csproj /m /p:Configuration=Release /p:Platform=x86 /verbosity:minimal
      - name: Build WPF desktop application
        run: msbuild src/ITDigitacao.Wpf/ITDigitacao.Wpf.csproj /m /p:Configuration=Release /p:Platform=x86 /verbosity:minimal
      - name: Core regression tests
        run: dotnet test tests/ITDigitacao.Core.Tests/ITDigitacao.Core.Tests.csproj --configuration Release --verbosity minimal
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: IT-Digitacao-Release
          path: src/ITDigitacao.App/bin/x86/Release/net48/
      - name: Upload WPF release
        uses: actions/upload-artifact@v4
        with:
          name: IT-Digitacao-3.0-Release
          path: src/ITDigitacao.Wpf/bin/x86/Release/net48/
