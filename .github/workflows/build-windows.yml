name: Build Windows
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build .NET Framework application
        run: msbuild src/ITDigitacao.App/ITDigitacao.App.csproj /m /p:Configuration=Release /p:Platform=x86 /verbosity:minimal
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: IT-Digitacao-Release
          path: src/ITDigitacao.App/bin/Release/
